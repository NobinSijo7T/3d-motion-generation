services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    image: node:20
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend
